idade. Ninguém se preocupa em cumprir metas. É hora de “cobrar” prazos. O que você faria como supervisor, gerente ou líder desse grupo?\",\"alternatives\":[{\"id\":\"7iqhac\",\"leadershipStyle\":\"autocrat\",\"text\":\"Definiria punições para quem não cumpriu os prazos determinados.\"},{\"id\":\"ma67zs\",\"leadershipStyle\":\"liberal\",\"text\":\"Permitiria que a equipe definisse entre si ações que favorecessem o alcance das metas nos prazos.\"},{\"id\":\"ca67ng\",\"leadershipStyle\":\"democrat\",\"text\":\"Pediria à equipe sugestões de como melhorar a produtividade e a entrega de tarefas dentro do prazo.\"}],\"feedback\":\"\",\"selected\":0},{\"id\":5,\"question\":\"Qual dessas frases você usaria enquanto gerente ou líder de uma equipe, se seu subordinado lhe pedisse ajuda para resolver um problema?\",\"alternatives\":[{\"id\":\"ga25oh\",\"leadershipStyle\":\"autocrat\",\"text\":\"“Deixa eu lhe mostrar como faz”.\"},{\"id\":\"pka4as\",\"leadershipStyle\":\"liberal\",\"text\":\"“Faça da forma que lhe parecer mais certo”.\"},{\"id\":\"j79dow\",\"leadershipStyle\":\"democrat\",\"text\":\"“Você já tentou fazer isso de outra maneira?”\"}],\"feedback\":\"\",\"selected\":0},{\"id\":6,\"question\":\"Como você agiria exercendo a função de líder na orientação das atividades a serem realizadas?\",\"alternatives\":[{\"id\":\"vqil11\",\"leadershipStyle\":\"autocrat\",\"text\":\"Coordenaria as ações de forma diretiva para que a equipe funcione adequadamente.\"},{\"id\":\"0szfor\",\"leadershipStyle\":\"liberal\",\"text\":\"Na minha equipe, cada um faria o que acredita ser o melhor para a realização do seu trabalho.\"},{\"id\":\"in0c0g\",\"leadershipStyle\":\"democrat\",\"text\":\"Consultaria minha equipe para decidir como devo me orientar melhor.\"}],\"feedback\":\"\",\"selected\":0},{\"id\":7,\"question\":\"O que você faria se um dos membros de sua equipe precisasse realizar um trabalho difícil e complexo?\",\"alternatives\":[{\"id\":\"gb2z7q\",\"leadershipStyle\":\"autocrat\",\
